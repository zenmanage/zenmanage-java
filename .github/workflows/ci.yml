name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # README advertises Java 17+ support (the pom's compiler release target —
        # the optional Spring Boot auto-configuration pulls in Spring Boot 4.x,
        # which requires 17 as its own floor, so 11 cannot compile this module);
        # 21 is the LTS this repo recommends for local build/test with JaCoCo.
        java-version: [ '17', '21' ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Verify
        run: mvn -B clean verify

      - name: Upload JaCoCo Report
        if: always() && matrix.java-version == '21'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
