name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # README advertises Java 17+ support (the pom's compiler release target —
        # the optional Spring Boot auto-configuration pulls in Spring Boot 4.x,
        # which requires 17 as its own floor, so 11 cannot compile this module);
        # 21 is the LTS this repo recommends for local build/test with JaCoCo.
        java-version: [ '17', '21' ]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Verify
        run: mvn -B clean verify

      - name: Upload JaCoCo Report
        if: always() && matrix.java-version == '21'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
